# Local run, no AWS needed: https://localhost:8443 (TLS 1.3 only, self-signed, as in AWS)
# Local secrets are generated into .env by `make env` (gitignored): the
# repository contains no credential, not even a local one.
# API Gateway + Lambda authorizer are replaced by DEV_AUTH (fixed local subject);
# the UI is embedded in the API binary exactly as in production.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: soge
      POSTGRES_USER: sogeadmin
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?run make env first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sogeadmin -d soge"]
      interval: 2s
      retries: 20
    configs:
      - source: rds_iam   # Aurora's rds_iam role, emulated locally
        target: /docker-entrypoint-initdb.d/00-rds-iam.sql

  migrate:
    build: ./app/api
    command: ["migrate"]
    environment:
      DB_WRITER_HOST: db
      DB_ADMIN_USER: sogeadmin
      DB_ADMIN_PASSWORD: ${LOCAL_DB_PASSWORD:?run make env first}
      DB_SSLMODE: disable
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./app/api
    ports: ["8443:8443"]
    environment:
      DEV_AUTH: "true"
      TLS_ENABLED: "true"
      QUOTE_SIGNING_KEY: ${LOCAL_QUOTE_KEY:?run make env first}
      DB_WRITER_HOST: db
      DB_USER: sogeadmin          # locally: admin + password (IAM auth in AWS)
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?run make env first}
      DB_SSLMODE: disable
      EMF_METRICS: "false"
      HEALTH_ADDR: 127.0.0.1:8079
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Test client (make smoke / outage): curl built with OpenSSL (TLS 1.3 flags), jq.
  # macOS ships a curl without --tlsv1.3 support, so checks never depend on the host.
  tools:
    profiles: [tools]
    build:
      dockerfile_inline: |
        FROM alpine:3.24
        RUN apk add --no-cache bash curl jq
    command: ["sleep", "infinity"]
    init: true
    volumes: ["./scripts:/scripts:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

configs:
  rds_iam:
    content: "CREATE ROLE rds_iam;"
